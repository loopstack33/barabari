publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  fl_chart: ^1.2.0
  table_calendar: ^3.2.1
  google_fonts: ^6.2.1
